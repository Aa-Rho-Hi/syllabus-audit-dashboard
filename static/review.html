<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syllabus Audit · Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f3; --panel:#fff; --ink:#1f1d1b; --muted:#6f6962; --line:#e6e1da;
  --brand:#500000; --brand-hover:#6b0b0b;
  --bad:#c62828; --bad-bg:#fde4e4; --warn:#986300; --warn-bg:#fff3d4; --good:#1e6b3a; --good-bg:#e4f4e9;
  --sans:"Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
button,input,textarea{font:inherit}
button{cursor:pointer;border-radius:8px;border:1px solid transparent}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:13px}
header{background:var(--brand);color:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;min-height:58px;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;font-weight:600;margin:0}
header a{color:#fff;opacity:.85;font-size:13.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px}
.btn{background:var(--brand);color:#fff;font-weight:600;padding:9px 16px}
.btn:hover{background:var(--brand-hover)}
.btn:disabled{opacity:.6;cursor:wait}
.ghost{background:#fff;border-color:var(--line);color:var(--ink);font-weight:500;padding:8px 13px}
.ghost:hover{border-color:#c4bcb2}
.bad-btn{background:#fff;border-color:#e8b4b4;color:var(--bad);font-weight:600;padding:8px 14px}
input[type=text],input[type=password],textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
input:focus,textarea:focus{outline:2px solid #c9a3a3;outline-offset:0;border-color:transparent}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0 12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;padding:9px 13px;font-weight:500;color:var(--muted);border-radius:0;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.count{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:#eee8e1;font-size:12px;margin-left:4px;text-align:center}
.tabs button.on .count{background:var(--brand);color:#fff}
.note{border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.note.warn{background:var(--warn-bg);color:#5a3c00} .note.bad{background:var(--bad-bg);color:#6d1414}
.sub-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.sub-head h2{font-size:17px;margin:0;font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip.pending{background:#eef2f6;color:#24364d} .chip.approved{background:var(--good-bg);color:var(--good)}
.chip.changes_requested{background:var(--warn-bg);color:var(--warn)}
.chip.flag{background:var(--bad-bg);color:var(--bad)} .chip.clean{background:var(--good-bg);color:var(--good)}
.meta{font-size:13px;color:var(--muted);margin-top:3px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.cols.one{grid-template-columns:1fr}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.cols h4{margin:0 0 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
ol{margin:0;padding-left:20px} li{margin:4px 0}
.cat li{color:#5c5751}
mark{background:none;color:var(--bad);font-weight:600;text-decoration:underline;text-underline-offset:2px}
mark.warn{color:var(--warn)}
.issues{margin-top:10px;font-size:13.5px;color:#4a4540;background:#faf8f6;border-radius:8px;padding:8px 11px}
.issues div{margin:2px 0}
.fnote{margin-top:10px;font-size:14px;border-left:3px solid var(--line);padding-left:10px}
.actions{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.actions .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.decided{margin-top:12px;font-size:13.5px;background:#faf8f6;border-radius:8px;padding:8px 11px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #d8d2cb;border-top-color:var(--brand);border-radius:50%;animation:s .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Syllabus Audit · Coordinator review</h1><a href="/">Faculty page</a></div></header>

<div class="wrap">
  <div class="card hidden" id="login" style="max-width:420px;margin:40px auto">
    <h2 style="font-size:17px;margin:0 0 12px">Coordinator sign in</h2>
    <form id="login-form"><input id="pass" type="password" placeholder="Review passcode" autocomplete="current-password" required>
      <div id="login-msg" class="small" style="color:var(--bad);margin:8px 0"></div>
      <button class="btn" id="login-btn">Open review queue</button></form>
  </div>

  <div id="main" class="hidden">
    <div class="toolbar">
      <input id="search" type="text" placeholder="Search course or faculty" style="max-width:280px">
      <input id="reviewer" type="text" placeholder="Your name (for the record)" style="max-width:220px">
      <span style="flex:1"></span>
      <button class="ghost" id="refresh" type="button">Refresh</button>
      <button class="ghost" id="csv" type="button">Download CSV</button>
    </div>
    <div id="storage"></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="list"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let PASS = "", ITEMS = [], TAB = "pending", AVOID_RE = null, TERM = {}, VERBS = null;
const LABEL = {pending:"Pending", changes_requested:"Changes requested", approved:"Approved"};

/* same red-word highlighting as the faculty page */
async function loadVerbs(){
  VERBS = await (await fetch("/api/verbs")).json();
  VERBS.avoid_terms.forEach(t => TERM[t.term] = t);
  AVOID_RE = new RegExp("\\b(" + VERBS.avoid_terms.map(t => t.term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/ /g, "\\s+")).join("|") + ")\\b", "gi");
}
function paint(text){
  if (!AVOID_RE) return esc(text);
  let html = "", i = 0, m; AVOID_RE.lastIndex = 0;
  while ((m = AVOID_RE.exec(text))){ html += esc(text.slice(i, m.index)) + `<mark>${esc(m[0])}</mark>`; i = m.index + m[0].length; }
  return html + esc(text.slice(i));
}

async function api(path, opts = {}){
  const r = await fetch(path, {...opts, headers:{"Content-Type":"application/json", "X-Review-Passcode": PASS, ...(opts.headers||{})}});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.detail || "Request failed"), {status: r.status});
  return d;
}
async function load(){
  try{
    const d = await api("/api/review/submissions");
    ITEMS = d.items;
    $("#storage").innerHTML = d.storage_error ? `<div class="note bad"><b>Google Sheet problem:</b> ${esc(d.storage_error)} New submissions are being kept in a temporary file until it's fixed.</div>`
      : d.storage !== "Google Sheet" ? `<div class="note warn">Submissions are saved in a temporary file on the server and will be lost on the next deploy. Set <b>SUBMISSIONS_SHEET</b> to a Google Sheet to keep them.</div>` : "";
    $("#login").classList.add("hidden"); $("#main").classList.remove("hidden");
    render();
  }catch(e){
    if (e.status === 401 || e.status === 503){ try{ sessionStorage.removeItem("rpass"); }catch(_){}
      $("#main").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#login-msg").textContent = PASS ? e.message : ""; }
    else $("#list").innerHTML = `<div class="note bad">Couldn't load submissions: ${esc(e.message)}</div>`;
  }
}
function filtered(){
  const q = $("#search").value.trim().toLowerCase();
  return ITEMS.filter(x => (TAB === "all" || x.status === TAB) &&
    (!q || [x.course_number, x.course_name, x.faculty_name, x.faculty_email, x.id].join(" ").toLowerCase().includes(q)));
}
function render(){
  const n = s => ITEMS.filter(x => x.status === s).length;
  $("#tabs").innerHTML = [["pending","Pending"],["changes_requested","Changes requested"],["approved","Approved"],["all","All"]]
    .map(([k,l]) => `<button class="${TAB===k?"on":""}" data-t="${k}">${l}<span class="count">${k==="all"?ITEMS.length:n(k)}</span></button>`).join("");
  const rows = filtered();
  $("#list").innerHTML = rows.map(card).join("") || `<p class="muted" style="margin:24px 4px">${TAB==="pending" ? "Nothing waiting for review." : "Nothing here."}</p>`;
}
function card(x){
  const flag = x.flagged ? `<span class="chip flag">${x.flagged} of ${x.objectives.length} flagged</span>` : `<span class="chip clean">No problems found</span>`;
  const cat = x.catalog_objectives.length;
  const decided = x.status !== "pending" ? `<div class="decided"><b>${LABEL[x.status]}</b>${x.reviewer ? ` by ${esc(x.reviewer)}` : ""}${x.reviewed_at ? ` · ${esc(x.reviewed_at)}` : ""}${x.reviewer_comment ? `<div style="margin-top:3px">${esc(x.reviewer_comment)}</div>` : ""}</div>` : "";
  return `<div class="card" data-id="${esc(x.id)}">
    <div class="sub-head"><h2>${esc(x.course_number)}${x.course_name ? " · " + esc(x.course_name) : ""}</h2>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${flag}<span class="chip ${x.status}">${LABEL[x.status] || x.status}</span></div></div>
    <div class="meta">${esc(x.faculty_name)} · <a href="mailto:${esc(x.faculty_email)}">${esc(x.faculty_email)}</a> · ${esc(x.submitted_at)} · #${esc(x.id)}${x.ai_checked ? "" : " · basic check only"}</div>
    ${x.note ? `<div class="fnote">${esc(x.note)}</div>` : ""}
    <div class="cols ${cat ? "" : "one"}">
      <div><h4>Submitted</h4><ol>${x.objectives.map(o => `<li>${paint(o)}</li>`).join("")}</ol></div>
      ${cat ? `<div class="cat"><h4>Currently in catalog${x.catalog_file ? ` <span style="text-transform:none;letter-spacing:0">(${esc(x.catalog_file)})</span>` : ""}</h4><ol>${x.catalog_objectives.map(o => `<li>${paint(o)}</li>`).join("")}</ol></div>` : ""}
    </div>
    ${!cat ? `<div class="meta" style="margin-top:8px">New course: nothing in the catalog for this number.</div>` : ""}
    ${x.issues.length ? `<div class="issues">${x.issues.map(i => `<div>${esc(i)}</div>`).join("")}</div>` : ""}
    ${decided}
    <div class="actions">
      <textarea rows="2" class="comment" placeholder="Comment for the faculty member (required when requesting changes)">${x.status === "pending" ? "" : esc(x.reviewer_comment)}</textarea>
      <div class="row">
        <button class="btn act" data-s="approved">Approve</button>
        <button class="bad-btn act" data-s="changes_requested">Request changes</button>
        <button class="ghost copy">Copy objectives</button>
        ${x.status !== "pending" ? `<button class="ghost act" data-s="pending">Move back to pending</button>` : ""}
        <span class="small msg"></span>
      </div>
    </div></div>`;
}

$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (b){ TAB = b.dataset.t; render(); } });
$("#search").addEventListener("input", render);
$("#refresh").onclick = load;
$("#list").addEventListener("click", async e => {
  const cardEl = e.target.closest(".card[data-id]"); if (!cardEl) return;
  const x = ITEMS.find(i => i.id === cardEl.dataset.id), msg = cardEl.querySelector(".msg");
  if (e.target.classList.contains("copy")){
    try{ await navigator.clipboard.writeText(x.objectives.join("\n")); msg.textContent = "Copied"; msg.style.color = "var(--good)"; }catch(_){}
    return;
  }
  const b = e.target.closest(".act"); if (!b) return;
  const comment = cardEl.querySelector(".comment").value;
  b.disabled = true; msg.style.color = "var(--muted)"; msg.innerHTML = '<span class="spin"></span>Saving';
  try{
    const d = await api(`/api/review/${encodeURIComponent(x.id)}`, {method:"POST", body:JSON.stringify({status:b.dataset.s, comment, reviewer:$("#reviewer").value})});
    if (!d.ok){ msg.style.color = "var(--bad)"; msg.textContent = d.message; b.disabled = false; return; }
    Object.assign(x, d.item); render();
  }catch(err){ msg.style.color = "var(--bad)"; msg.textContent = err.message; b.disabled = false; }
});
$("#reviewer").addEventListener("change", () => { try{ localStorage.setItem("reviewer", $("#reviewer").value); }catch(_){} });
$("#csv").onclick = () => {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Ref","Status","Course","Course name","Faculty","Email","Submitted","Objectives","Flagged","Issues","Reviewer","Comment","Reviewed"]];
  filtered().forEach(x => rows.push([x.id, LABEL[x.status], x.course_number, x.course_name, x.faculty_name, x.faculty_email, x.submitted_at,
    x.objectives.join("\n"), x.flagged, x.issues.join("\n"), x.reviewer, x.reviewer_comment, x.reviewed_at]));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.map(r => r.map(q).join(",")).join("\n")], {type:"text/csv"}));
  a.download = `syllabus-submissions-${TAB}.csv`; a.click();
};
$("#login-form").addEventListener("submit", async e => {
  e.preventDefault(); PASS = $("#pass").value; const b = $("#login-btn"); b.disabled = true;
  await load(); b.disabled = false;
  if (!$("#main").classList.contains("hidden")) try{ sessionStorage.setItem("rpass", PASS); }catch(_){}
});

(async () => {
  try{ $("#reviewer").value = localStorage.getItem("reviewer") || ""; PASS = sessionStorage.getItem("rpass") || ""; }catch(_){}
  loadVerbs().then(() => ITEMS.length && render()).catch(() => {});
  if (PASS) await load(); else $("#login").classList.remove("hidden");
  setInterval(() => { if (PASS && !$("#main").classList.contains("hidden") && !document.querySelector(".comment:focus")) load(); }, 60000);
})();
</script>
</body>
</html>
